<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAMESOL - On-Chain Space Strategy</title>
    <link rel="icon" type="image/jpeg" href="/src/assets/ui/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
      html,body,#root{width:100%;height:100%;margin:0;background:#01050c}
      body{overflow:hidden}
      .gamesol-boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;color:#eafaff;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(17,85,116,.28),transparent 28%),linear-gradient(180deg,#020914,#01050c);font-family:Arial,sans-serif}
      .gamesol-boot::before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle,rgba(125,224,255,.38) 0 1px,transparent 1.5px);background-size:89px 89px;mask-image:linear-gradient(to bottom,transparent,#000 24%,#000 76%,transparent)}
      .gamesol-boot>*{position:relative}.gamesol-boot img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(95,222,255,.32))}
      .gamesol-boot small{margin-top:7px;color:#71dcff;font:700 9px/1.4 monospace;letter-spacing:2px}.gamesol-boot strong{font:600 clamp(25px,5vw,42px)/1.1 Arial,sans-serif;letter-spacing:-1px}.gamesol-boot p{margin:0;color:#7899aa;font:10px/1.5 monospace;letter-spacing:1px}
      .gamesol-boot-progress{width:min(320px,72vw);height:3px;margin-top:12px;overflow:hidden;border-radius:99px;background:rgba(107,220,255,.1)}.gamesol-boot-progress i{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,#70e2ff,transparent);animation:gamesol-boot-scan 1.25s ease-in-out infinite}
      .gamesol-boot.is-error{gap:14px}.gamesol-boot.is-error img{filter:grayscale(.4) drop-shadow(0 0 18px rgba(255,118,96,.18))}.gamesol-boot.is-error small{color:#ff9b88}.gamesol-boot.is-error p{max-width:430px;color:#9fb5c1}.gamesol-boot button{min-height:42px;margin-top:10px;padding:0 18px;border:1px solid rgba(112,224,255,.55);border-radius:7px;background:#0d4562;color:#effcff;font:700 9px monospace;letter-spacing:1px;cursor:pointer}
      @keyframes gamesol-boot-scan{from{transform:translateX(-115%)}to{transform:translateX(260%)}}
      @media(prefers-reduced-motion:reduce){.gamesol-boot-progress i{animation:none;width:100%;opacity:.7}}
    </style>
  </head>
  <body>
    <div id="root"><main class="gamesol-boot" role="status" aria-live="polite"><img src="/src/assets/ui/logobg.png" alt="" /><small>GAMESOL COMMAND NETWORK</small><strong>Entering the universe</strong><p>LOADING LIVE SOLANA DEVNET SYSTEMS</p><div class="gamesol-boot-progress" aria-hidden="true"><i></i></div></main></div>
    <noscript>GAMESOL requires JavaScript to render the live universe.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
